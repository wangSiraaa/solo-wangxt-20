# 可选：使用真实 PostgreSQL 替代内嵌 PGlite
# 启动后设置环境变量 DATABASE_URL=postgres://postgres:postgres@localhost:5432/subtitle_delivery
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subtitle_delivery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
